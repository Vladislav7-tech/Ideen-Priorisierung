<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ideen-Priorisierer</title>
<style>
  :root {
    --bg: #f5f5f2;
    --surface: #ffffff;
    --border: #e6e5e0;
    --text: #141413;
    --text-2: #5e5d59;
    --muted: #9a9993;
    --accent: #2a78d6;
    --accent-soft: #e8f0fb;
    --neg: #c63b3a;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 40px 24px 64px; display: grid; gap: 20px; }
  h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.02em; }
  .grid-2 { display: grid; gap: 20px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 820px) { .grid-2 { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; }
  h2 { font-size: 16px; margin: 0 0 16px; }
  label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 5px; }
  input, textarea {
    width: 100%; font: inherit; color: var(--text); background: #fff;
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  textarea { resize: vertical; min-height: 76px; }
  .fields { display: grid; gap: 14px; grid-template-columns: repeat(3, 1fr); }
  .fields .full { grid-column: 1 / -1; }
  @media (max-width: 520px) { .fields { grid-template-columns: 1fr; } }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 10px; padding: 10px 16px;
    border: 1px solid var(--border); background: #fff; color: var(--text);
  }
  button:hover { background: #f2f1ed; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { filter: brightness(0.93); background: var(--accent); }
  button.big { padding: 14px 34px; font-size: 16px; }
  button.ghost { border: none; background: none; padding: 4px 6px; color: var(--muted); font-weight: 500; }
  button.ghost:hover { color: var(--text); background: none; }
  button:disabled { opacity: .6; cursor: wait; }

  .add { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .add .desc { grid-column: 1 / -1; }
  .ideas { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 6px; max-height: 300px; overflow: auto; }
  .ideas li {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    border-radius: 10px; padding: 8px 6px 8px 12px; background: #f8f8f5;
  }
  .ideas .del { color: var(--muted); font-size: 16px; padding: 2px 8px; }
  .ideas .del:hover { color: var(--neg); }
  .ideas-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }

  .run { display: grid; justify-items: center; gap: 10px; padding: 4px 0; }
  .key-row { display: flex; gap: 8px; width: min(460px, 100%); }
  .key-row input { flex: 1; }
  .key-saved { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .status { min-height: 20px; font-size: 14px; color: var(--text-2); text-align: center; }
  .status.error { color: var(--neg); }

  .result-row { display: grid; grid-template-columns: 36px 1fr 220px; gap: 14px; align-items: center; padding: 14px 4px; border-top: 1px solid var(--border); cursor: pointer; }
  .result-row:first-of-type { border-top: none; }
  .result-row:hover .title { color: var(--accent); }
  .rank { font-weight: 700; font-size: 17px; color: var(--muted); text-align: center; }
  .result-row.top .rank { color: var(--text); }
  .title { font-weight: 600; }
  .sub { font-size: 13px; color: var(--muted); }
  .value { display: grid; gap: 6px; justify-items: end; }
  .value strong { font-variant-numeric: tabular-nums; font-size: 16px; }
  .bar { width: 100%; height: 6px; border-radius: 3px; background: #f0efea; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
  .neg { color: var(--neg); }
  @media (max-width: 560px) { .result-row { grid-template-columns: 28px 1fr 120px; } }

  .detail { padding: 4px 4px 18px 54px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; cursor: default; }
  @media (max-width: 720px) { .detail { grid-template-columns: 1fr; padding-left: 4px; } }
  .detail p { margin: 0 0 10px; color: var(--text-2); }
  .detail h4 { margin: 0 0 4px; font-size: 13px; }
  .edit { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .edit input { padding: 7px 10px; }
  .calc { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; margin: 0; }
  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ideen-Priorisierer</h1>

  <div class="grid-2">
    <section class="card">
      <h2>Team</h2>
      <div class="fields">
        <div><label for="rate">Stundensatz (€)</label><input id="rate" type="number" min="1"></div>
        <div><label for="teamSize">Personen</label><input id="teamSize" type="number" min="1"></div>
        <div><label for="weeks">Wochen / Jahr</label><input id="weeks" type="number" min="1" max="52"></div>
        <div class="full"><label for="context">Wie arbeitet das Team?</label><textarea id="context" rows="5"></textarea></div>
      </div>
    </section>

    <section class="card">
      <h2>Ideen</h2>
      <form id="ideaForm" class="add">
        <input id="ideaTitle" placeholder="Neue Idee" required>
        <button class="primary" type="submit">+</button>
        <input id="ideaDesc" class="desc" placeholder="Beschreibung (optional)">
      </form>
      <ul id="ideaList" class="ideas"></ul>
      <div class="ideas-foot">
        <button id="loadExamples" type="button" class="ghost">Beispiele laden</button>
        <button id="clearIdeas" type="button" class="ghost">Alle löschen</button>
      </div>
    </section>
  </div>

  <div class="run">
    <div class="key-row" id="keyRow">
      <input id="apiKey" type="password" placeholder="API-Key (Claude oder OpenAI)" autocomplete="off">
      <button type="button" id="saveKey">Speichern</button>
    </div>
    <div class="key-saved" id="keySaved" hidden>
      API-Key gespeichert · <button type="button" class="ghost" id="deleteKey">entfernen</button>
    </div>
    <button class="primary big" id="evaluate">Ideen bewerten</button>
    <div class="status" id="status" role="status"></div>
  </div>

  <section class="card" id="results" hidden>
    <h2>Priorisierung</h2>
    <div id="resultBody"></div>
  </section>
</div>

<script>
"use strict";

/* ---------- Konfiguration ---------- */
const STORE_KEY = "ideen-priorisierer-v2";
const KEY_STORE = "ideen-priorisierer-key";
const MODELS = { anthropic: "claude-sonnet-5-5", openai: "gpt-5.4-mini" };
const providerOf = (key) => (key.startsWith("sk-ant-") ? "anthropic" : "openai");

const EXAMPLE_IDEAS = [
  ["Meeting-Zeiten reduzieren", "Weniger und kürzere Meetings, klare Agenda, feste meetingfreie Zeiten"],
  ["Wissensdatenbank verbessern", "Zentrale, durchsuchbare Ablage für Prozesse und Lösungen"],
  ["Onboarding automatisieren", "Checklisten, Zugänge und Einarbeitungsmaterial automatisch bereitstellen"],
  ["AI-Assistent für Support-Anfragen", "KI schlägt Antworten auf häufige Kundenanfragen vor"],
  ["Automatische Dokumentation", "Ticket-Notizen, Gesprächszusammenfassungen und Meeting-Protokolle automatisch erstellen"],
  ["Tool-Landschaft vereinfachen", "Überschneidende Tools zusammenführen, Lizenzen reduzieren"],
  ["Automatische Wochenreports", "KPIs automatisch aus den Systemen ziehen statt manuell in Excel"],
  ["Self-Service-FAQ für Kunden", "Häufige Fragen online beantworten, bevor ein Ticket entsteht"],
  ["Textbausteine für Tickets", "Abgestimmte Vorlagen für wiederkehrende Antworten"],
  ["Zentrale Projektübersicht", "Ein Dashboard für Status, Verantwortliche und Termine"]
];

/* Interner Fallback, falls die KI nicht erreichbar ist (z. B. kein Internet bei der Demo). share = Anteil des Teams */
const FALLBACK_RULES = [
  { kw: ["meeting"], share: 1.0, h: 1.5, effort: 16, run: 0, conf: 60, why: "Kürzere und seltenere Meetings sparen direkt Arbeitszeit bei allen. Die Umsetzung braucht vor allem Absprachen." },
  { kw: ["wissen", "wiki"], share: 1.0, h: 1.0, effort: 120, run: 1500, conf: 50, why: "Weniger Suchzeit und Rückfragen, wenn Lösungen zentral auffindbar sind – sofern die Inhalte gepflegt werden." },
  { kw: ["onboarding", "einarbeitung"], share: 0.15, h: 2.0, effort: 80, run: 0, conf: 55, why: "Neue Mitarbeitende und ihre Paten sparen Zeit bei Zugängen und Standardfragen." },
  { kw: ["support", "assistent", "anfrage"], share: 0.6, h: 3.0, effort: 200, run: 6000, conf: 45, why: "Antwortvorschläge verkürzen die Bearbeitung wiederkehrender Anfragen deutlich, kosten aber Integration und API-Gebühren." },
  { kw: ["dokument", "protokoll", "notiz"], share: 0.6, h: 1.5, effort: 60, run: 2400, conf: 50, why: "Ticket-Notizen und Protokolle entstehen automatisch statt manuell." },
  { kw: ["tool", "lizenz"], share: 1.0, h: 0.5, effort: 160, run: -3000, conf: 40, why: "Weniger Kontextwechsel und geringere Lizenzkosten, aber aufwendige Migration." },
  { kw: ["report", "bericht", "kpi"], share: 0.1, h: 3.0, effort: 40, run: 0, conf: 70, why: "Manuelle Reports sind gut automatisierbar; wenige Personen sparen viel Zeit." },
  { kw: ["faq", "self-service"], share: 0.6, h: 1.5, effort: 60, run: 0, conf: 55, why: "Jede Anfrage, die gar nicht erst entsteht, spart Bearbeitungszeit." },
  { kw: ["textbaustein", "vorlage"], share: 0.6, h: 1.0, effort: 16, run: 0, conf: 70, why: "Geringer Aufwand, sofort wirksam: Standardantworten müssen nicht neu formuliert werden." },
  { kw: ["projekt", "dashboard", "übersicht"], share: 0.3, h: 1.0, effort: 40, run: 600, conf: 50, why: "Weniger Statusabfragen, weil der Stand jederzeit sichtbar ist." }
];
const FALLBACK_DEFAULT = { share: 0.3, h: 0.5, effort: 40, run: 0, conf: 30, why: "Vorsichtige Standardschätzung – bitte Werte prüfen." };

/* ---------- State ---------- */
let state = loadState();
let openId = null;

function defaultState() {
  return {
    team: { rate: 50, size: 40, weeks: 46,
      context: "Kundenservice- und Operations-Team eines Mobilfunkanbieters. Viel Ticketbearbeitung, wöchentliche Abstimmungsmeetings, Reports in Excel, viele verschiedene Tools." },
    ideas: []
  };
}
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && s.team && Array.isArray(s.ideas)) return s;
  } catch (e) { /* kein Speicher verfügbar */ }
  return defaultState();
}
function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
function getKey() { try { return localStorage.getItem(KEY_STORE) || ""; } catch (e) { return ""; } }
function setKey(k) { try { k ? localStorage.setItem(KEY_STORE, k) : localStorage.removeItem(KEY_STORE); } catch (e) {} }

const $ = (id) => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eur = (n) => (n < 0 ? "−" : "") + Math.abs(Math.round(n)).toLocaleString("de-DE") + " €";
const num = (v, d = 0) => { const n = parseFloat(String(v).replace(",", ".")); return Number.isFinite(n) ? n : d; };
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

/* ---------- Berechnung ----------
   Nutzen pro Jahr = eingesparte Arbeitszeit in € (gewichtet mit Konfidenz)
                     − Umsetzungsaufwand − laufende Kosten               */
function calc(e) {
  const t = state.team;
  const gross = e.persons * e.hours * t.rate * t.weeks * (e.conf / 100);
  const oneTime = e.effort * t.rate;
  return { gross, oneTime, net: gross - oneTime - e.running };
}

/* Plausibilisierung der KI-Werte */
function sanitize(raw) {
  const size = state.team.size;
  return {
    persons: clamp(Math.round(num(raw.persons, 1)), 0, size),
    hours: clamp(num(raw.hours, 0), 0, 10),
    effort: clamp(num(raw.effort, 0), 0, 100000),
    running: clamp(num(raw.running, 0), -1e7, 1e7),
    conf: clamp(Math.round(num(raw.conf, 50)), 10, 100),
    why: String(raw.why || "").trim(),
    risk: String(raw.risk || "").trim()
  };
}

function fallbackEvaluate(idea) {
  const text = (idea.title + " " + (idea.desc || "")).toLowerCase();
  const r = FALLBACK_RULES.find((x) => x.kw.some((k) => text.includes(k))) || FALLBACK_DEFAULT;
  return sanitize({ persons: Math.max(1, Math.round(r.share * state.team.size)), hours: r.h, effort: r.effort, running: r.run, conf: r.conf, why: r.why });
}

/* ---------- KI ---------- */
const TOOL = {
  name: "bewertungen_speichern",
  description: "Speichert die Schätzung für jede Idee.",
  input_schema: {
    type: "object",
    properties: {
      bewertungen: {
        type: "array",
        items: {
          type: "object",
          properties: {
            id: { type: "string" },
            betroffene_personen: { type: "integer" },
            ersparnis_stunden_pro_woche_pro_person: { type: "number" },
            umsetzungsaufwand_stunden: { type: "number" },
            laufende_kosten_eur_pro_jahr: { type: "number", description: "Negativ = Einsparung" },
            konfidenz_prozent: { type: "integer", description: "10–100" },
            begruendung: { type: "string", description: "2–3 kurze Sätze" },
            risiken: { type: "string", description: "1 kurzer Satz" }
          },
          required: ["id", "betroffene_personen", "ersparnis_stunden_pro_woche_pro_person", "umsetzungsaufwand_stunden",
                     "laufende_kosten_eur_pro_jahr", "konfidenz_prozent", "begruendung", "risiken"]
        }
      }
    },
    required: ["bewertungen"]
  }
};

function buildPrompt(ideas) {
  const t = state.team;
  return `Du bist ein nüchterner Prozess- und Wirtschaftlichkeitsanalyst. Schätze für jede Idee realistische Werte, damit das Team sie nach wirtschaftlichem Nutzen priorisieren kann.

Team: ${t.size} Personen, Stundensatz ${t.rate} €/h, ${t.weeks} Arbeitswochen pro Jahr.
Kontext: ${t.context || "keine Angabe"}

Regeln:
- Sei konservativ. Typische Ersparnis: 0,25–3 Stunden pro Person und Woche; mehr nur mit klarer Begründung.
- betroffene_personen ≤ ${t.size}; zähle nur Personen, deren Arbeit sich wirklich verändert.
- umsetzungsaufwand_stunden: einmaliger Aufwand inkl. Abstimmung. Organisatorisches ist günstig, Software-Integration teuer.
- konfidenz_prozent: 20–40 bei vagen Ideen, 70–90 bei klar messbaren.
- Interpretiere jede Idee so, wie sie für genau dieses Team am sinnvollsten ist.
- Bewerte alle Ideen im Vergleich zueinander.
- Begründung und Risiken auf Deutsch, kurz und konkret.

Ideen:
${ideas.map((i) => `- id: ${i.id} | ${i.title}${i.desc ? " – " + i.desc : ""}`).join("\n")}

Rufe unbedingt das Tool "${TOOL.name}" mit genau einer Bewertung pro Idee auf. Antworte nicht mit Fließtext.`;
}

async function postJson(url, headers, body) {
  const res = await fetch(url, { method: "POST", headers: { "content-type": "application/json", ...headers }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  return { res, data, msg: data?.error?.message || res.statusText };
}

async function callClaude(ideas, key, opts = { temperature: true, forceTool: true }) {
  const body = {
    model: MODELS.anthropic, max_tokens: 16000, tools: [TOOL],
    tool_choice: opts.forceTool ? { type: "tool", name: TOOL.name } : { type: "auto" },
    messages: [{ role: "user", content: buildPrompt(ideas) }]
  };
  if (opts.temperature) body.temperature = 0;
  const { res, data, msg } = await postJson("https://api.anthropic.com/v1/messages",
    { "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" }, body);
  if (!res.ok) {
    // Nicht jedes Modell unterstützt jeden Parameter -> ohne diesen Parameter erneut versuchen
    if (res.status === 400 && opts.forceTool && /tool_choice/i.test(msg)) return callClaude(ideas, key, { ...opts, forceTool: false });
    if (res.status === 400 && opts.temperature && /temperature/i.test(msg)) return callClaude(ideas, key, { ...opts, temperature: false });
    throw Object.assign(new Error(msg), { status: res.status });
  }
  const tool = (data.content || []).find((c) => c.type === "tool_use" && c.name === TOOL.name);
  if (tool) return tool.input?.bewertungen;
  return extractJson((data.content || []).filter((c) => c.type === "text").map((c) => c.text).join("\n"))?.bewertungen;
}

async function callOpenAI(ideas, key, withTemperature = true) {
  const body = {
    model: MODELS.openai,
    messages: [{ role: "user", content: buildPrompt(ideas) }],
    tools: [{ type: "function", function: { name: TOOL.name, description: TOOL.description, parameters: TOOL.input_schema } }],
    tool_choice: { type: "function", function: { name: TOOL.name } }
  };
  if (withTemperature) body.temperature = 0;
  const { res, data, msg } = await postJson("https://api.openai.com/v1/chat/completions", { authorization: "Bearer " + key }, body);
  if (!res.ok) {
    if (withTemperature && res.status === 400 && /temperature/i.test(msg)) return callOpenAI(ideas, key, false);
    throw Object.assign(new Error(msg), { status: res.status });
  }
  return extractJson(data.choices?.[0]?.message?.tool_calls?.[0]?.function?.arguments || "")?.bewertungen;
}

function extractJson(text) {
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  if (a < 0 || b <= a) return null;
  try { return JSON.parse(text.slice(a, b + 1)); } catch (e) { return null; }
}

const fromAI = (b) => sanitize({
  persons: b.betroffene_personen, hours: b.ersparnis_stunden_pro_woche_pro_person,
  effort: b.umsetzungsaufwand_stunden, running: b.laufende_kosten_eur_pro_jahr,
  conf: b.konfidenz_prozent, why: b.begruendung, risk: b.risiken
});

async function evaluate() {
  if (!state.ideas.length) return setStatus("Bitte zuerst Ideen erfassen.", true);
  const key = getKey();
  if (!key) { $("apiKey").focus(); return setStatus("Bitte API-Key eintragen.", true); }

  const btn = $("evaluate");
  btn.disabled = true;
  setStatus(`<span class="spinner"></span>Die KI bewertet ${state.ideas.length} Ideen …`);
  try {
    const results = providerOf(key) === "anthropic" ? await callClaude(state.ideas, key) : await callOpenAI(state.ideas, key);
    if (!Array.isArray(results)) throw new Error("Keine gültige Antwort der KI.");
    state.ideas.forEach((idea) => {
      const b = results.find((r) => String(r.id) === idea.id);
      idea.eval = b ? fromAI(b) : fallbackEvaluate(idea);
    });
    setStatus("");
  } catch (err) {
    const reason = err.status === 401 ? "API-Key ungültig"
      : /quota|credit|balance/i.test(err.message || "") ? "kein Guthaben"
      : "nicht erreichbar";
    state.ideas.forEach((idea) => (idea.eval = fallbackEvaluate(idea)));
    setStatus(`KI ${reason} – vorläufige Schätzung ohne KI angezeigt.`, true);
  } finally {
    btn.disabled = false;
    openId = null; saveState(); renderResults();
  }
}
function setStatus(html, isError) { const s = $("status"); s.innerHTML = html; s.classList.toggle("error", !!isError); }

/* ---------- Rendering ---------- */
function renderIdeas() {
  const ul = $("ideaList");
  ul.innerHTML = "";
  state.ideas.forEach((i) => {
    const li = document.createElement("li");
    li.innerHTML = `<span>${esc(i.title)}</span><button class="ghost del" aria-label="Idee löschen" data-del="${i.id}">×</button>`;
    ul.appendChild(li);
  });
}

function renderResults() {
  const list = state.ideas.filter((i) => i.eval).map((i) => ({ idea: i, r: calc(i.eval) })).sort((a, b) => b.r.net - a.r.net);
  $("results").hidden = !list.length;
  if (!list.length) return;
  const max = Math.max(...list.map((x) => x.r.net), 1);
  let html = "";
  list.forEach(({ idea, r }, idx) => {
    const w = r.net > 0 ? Math.max(2, (r.net / max) * 100) : 0;
    html += `<div class="result-row${idx < 3 ? " top" : ""}" data-open="${idea.id}">
      <div class="rank">${idx + 1}</div>
      <div><div class="title">${esc(idea.title)}</div>${idea.desc ? `<div class="sub">${esc(idea.desc)}</div>` : ""}</div>
      <div class="value"><strong class="${r.net < 0 ? "neg" : ""}">${eur(r.net)} / Jahr</strong><div class="bar"><i style="width:${w}%"></i></div></div>
    </div>`;
    if (openId === idea.id) html += detail(idea, r);
  });
  $("resultBody").innerHTML = html;
}

function detail(idea, r) {
  const e = idea.eval, t = state.team;
  const f = (k, label, step) => `<div><label>${label}</label><input type="number" step="${step}" value="${e[k]}" data-edit="${k}" data-id="${idea.id}"></div>`;
  return `<div class="detail">
    <div>
      <h4>Begründung</h4><p>${esc(e.why) || "–"}</p>
      ${e.risk ? `<h4>Risiko</h4><p>${esc(e.risk)}</p>` : ""}
    </div>
    <div>
      <div class="edit">
        ${f("persons", "Personen", 1)}
        ${f("hours", "Ersparnis h/Woche", 0.25)}
        ${f("effort", "Umsetzung (h)", 1)}
        ${f("running", "Laufende Kosten €/Jahr", 100)}
      </div>
      <div class="calc">${eur(r.gross)} Zeitersparnis − ${eur(r.oneTime)} Umsetzung − ${eur(e.running)} laufend</div>
    </div>
  </div>`;
}

function renderKey() {
  const has = !!getKey();
  $("keyRow").hidden = has;
  $("keySaved").hidden = !has;
}

/* ---------- Events ---------- */
function bindTeam(id, prop, isNum) {
  const el = $(id);
  el.value = state.team[prop];
  el.addEventListener("input", () => {
    state.team[prop] = isNum ? Math.max(1, num(el.value, 1)) : el.value;
    saveState(); renderResults();
  });
}
bindTeam("rate", "rate", true); bindTeam("teamSize", "size", true); bindTeam("weeks", "weeks", true); bindTeam("context", "context", false);

$("ideaForm").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const title = $("ideaTitle").value.trim();
  if (!title) return;
  state.ideas.push({ id: uid(), title, desc: $("ideaDesc").value.trim() });
  $("ideaTitle").value = ""; $("ideaDesc").value = ""; $("ideaTitle").focus();
  saveState(); renderIdeas();
});
$("ideaList").addEventListener("click", (ev) => {
  const id = ev.target.dataset.del; if (!id) return;
  state.ideas = state.ideas.filter((i) => i.id !== id);
  saveState(); renderIdeas(); renderResults();
});
$("loadExamples").addEventListener("click", () => {
  const existing = new Set(state.ideas.map((i) => i.title.toLowerCase()));
  EXAMPLE_IDEAS.forEach(([title, desc]) => { if (!existing.has(title.toLowerCase())) state.ideas.push({ id: uid(), title, desc }); });
  saveState(); renderIdeas();
});
$("clearIdeas").addEventListener("click", () => { state.ideas = []; saveState(); renderIdeas(); renderResults(); setStatus(""); });

const saveKey = () => { const k = $("apiKey").value.trim(); if (!k) return; setKey(k); $("apiKey").value = ""; renderKey(); setStatus(""); };
$("saveKey").addEventListener("click", saveKey);
$("apiKey").addEventListener("keydown", (ev) => { if (ev.key === "Enter") saveKey(); });
$("deleteKey").addEventListener("click", () => { setKey(""); renderKey(); });
$("evaluate").addEventListener("click", evaluate);

$("resultBody").addEventListener("click", (ev) => {
  if (ev.target.closest(".detail")) return;
  const row = ev.target.closest(".result-row");
  if (row) { openId = openId === row.dataset.open ? null : row.dataset.open; renderResults(); }
});
$("resultBody").addEventListener("change", (ev) => {
  const k = ev.target.dataset.edit; if (!k) return;
  const idea = state.ideas.find((i) => i.id === ev.target.dataset.id);
  idea.eval[k] = num(ev.target.value, 0);
  idea.eval = sanitize(idea.eval);
  saveState(); renderResults();
});

renderIdeas(); renderResults(); renderKey();
</script>
</body>
</html>
