<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ideen-Priorisierer</title>
<style>
  :root {
    --bg: #f5f5f2;
    --surface: #ffffff;
    --border: #e6e5e0;
    --text: #141413;
    --text-2: #5e5d59;
    --muted: #9a9993;
    --accent: #2a78d6;
    --neg: #c63b3a;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 40px 24px 64px; display: grid; gap: 20px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; }
  h2 { font-size: 16px; margin: 0 0 14px; }
  label { display: block; font-size: 12.5px; color: var(--text-2); margin-bottom: 4px; }
  input {
    width: 100%; font: inherit; color: var(--text); background: #fff;
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px;
  }
  input[type=number] { font-variant-numeric: tabular-nums; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 10px; padding: 9px 16px;
    border: 1px solid var(--border); background: #fff; color: var(--text);
  }
  button:hover { background: #f2f1ed; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { filter: brightness(0.93); background: var(--accent); }
  button.big { padding: 14px 34px; font-size: 16px; }
  button.ghost { border: none; background: none; padding: 4px 6px; color: var(--muted); font-weight: 500; }
  button.ghost:hover { color: var(--text); background: none; }
  button:disabled { opacity: .6; cursor: wait; }

  /* Ideen: eine Zeile pro Idee */
  .idea-grid { display: grid; grid-template-columns: 1fr 110px 110px 120px 36px; gap: 8px; align-items: end; }
  .idea-head { font-size: 12.5px; color: var(--text-2); padding: 0 2px 2px; }
  .idea-head span:nth-child(n+2) { text-align: left; }
  .ideas { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
  .ideas li .title { padding: 9px 2px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ideas li .title small { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .ideas li input { padding: 7px 9px; }
  .del { color: var(--muted); font-size: 18px; padding: 4px; }
  .del:hover { color: var(--neg); }
  .new { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 14px; }
  .new .desc { margin-top: 8px; }
  .new button { padding: 9px 0; }
  .foot { display: flex; justify-content: space-between; margin-top: 10px; }
  .empty-ideas { color: var(--muted); padding: 6px 2px 2px; margin: 0; }
  @media (max-width: 640px) {
    .idea-grid { grid-template-columns: 1fr 1fr 1fr 36px; }
    .idea-grid > :first-child { grid-column: 1 / -1; }
    .idea-head { display: none; }
    .ideas li { padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  }
  .mobile-label { display: none; }
  .new label { display: block; }
  @media (max-width: 640px) { .mobile-label { display: block; } }

  .run { display: grid; justify-items: center; gap: 10px; }
  .key-row { display: flex; gap: 8px; width: min(460px, 100%); }
  .key-row input { flex: 1; }
  .key-saved { font-size: 13px; color: var(--muted); }
  .status { min-height: 20px; font-size: 14px; color: var(--text-2); text-align: center; }
  .status.error { color: var(--neg); }

  .result-row { display: grid; grid-template-columns: 36px 1fr 220px; gap: 14px; align-items: center; padding: 14px 4px; border-top: 1px solid var(--border); cursor: pointer; }
  .result-row:first-child { border-top: none; }
  .result-row:hover .rtitle { color: var(--accent); }
  .rank { font-weight: 700; font-size: 17px; color: var(--muted); text-align: center; }
  .result-row.top .rank { color: var(--text); }
  .rtitle { font-weight: 600; }
  .value { display: grid; gap: 6px; justify-items: end; }
  .value strong { font-variant-numeric: tabular-nums; font-size: 16px; }
  .bar { width: 100%; height: 6px; border-radius: 3px; background: #f0efea; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
  .neg { color: var(--neg); }
  @media (max-width: 560px) { .result-row { grid-template-columns: 28px 1fr 120px; } }

  .detail { padding: 2px 4px 18px 54px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 720px) { .detail { grid-template-columns: 1fr; padding-left: 4px; } }
  .detail p { margin: 0 0 10px; color: var(--text-2); }
  .detail h4 { margin: 0 0 4px; font-size: 13px; }
  .edit { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .edit input { padding: 7px 9px; }
  .costs { font-size: 13.5px; color: var(--text-2); margin-bottom: 14px; }
  .cg { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 10px 0 4px; }
  .cg:first-child { margin-top: 2px; }
  .ci { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
  .ci span:last-child { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ci small { display: block; font-size: 12px; color: var(--muted); }
  .ci.sum { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 6px; color: var(--text); }
  .calc { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ideen-Priorisierer</h1>

  <section class="card">
    <h2>Ideen</h2>
    <div class="idea-grid idea-head" id="ideaHead">
      <span>Idee</span><span>Personen</span><span>€ pro Stunde</span><span>Std. pro Woche</span><span></span>
    </div>
    <ul id="ideaList" class="ideas"></ul>
    <p id="noIdeas" class="empty-ideas">Noch keine Ideen.</p>

    <form id="ideaForm" class="new">
      <div class="idea-grid">
        <div><label for="nTitle">Neue Idee</label><input id="nTitle" placeholder="z. B. Onboarding automatisieren" required></div>
        <div><label class="mobile-label" for="nPersons">Personen</label><input id="nPersons" type="number" min="1" value="5" title="Wie viele Personen sind von der Idee betroffen?"></div>
        <div><label class="mobile-label" for="nRate">€ pro Stunde</label><input id="nRate" type="number" min="1" value="30" title="Was kostet eine Arbeitsstunde dieser Personen?"></div>
        <div><label class="mobile-label" for="nHours">Std. pro Woche</label><input id="nHours" type="number" min="0" step="0.5" value="2" title="Wie viele Stunden pro Woche verbringt eine Person heute mit dieser Aufgabe?"></div>
        <div><button class="primary" type="submit" style="width:100%" aria-label="Idee hinzufügen">+</button></div>
      </div>
      <input id="nDesc" class="desc" placeholder="Beschreibung (optional)">
    </form>

    <div class="foot">
      <button id="loadExamples" type="button" class="ghost">Beispiele laden</button>
      <button id="clearIdeas" type="button" class="ghost">Alle löschen</button>
    </div>
  </section>

  <div class="run">
    <div class="key-row" id="keyRow">
      <input id="apiKey" type="password" placeholder="API-Key (Claude oder OpenAI)" autocomplete="off">
      <button type="button" id="saveKey">Speichern</button>
    </div>
    <div class="key-saved" id="keySaved" hidden>
      API-Key gespeichert · <button type="button" class="ghost" id="deleteKey">entfernen</button>
    </div>
    <button class="primary big" id="evaluate">Ideen bewerten</button>
    <div class="status" id="status" role="status"></div>
  </div>

  <section class="card" id="results" hidden>
    <h2>Priorisierung</h2>
    <div id="resultBody"></div>
  </section>
</div>

<script>
"use strict";

/* ---------- Konfiguration ---------- */
const STORE_KEY = "ideen-priorisierer-v3";
const KEY_STORE = "ideen-priorisierer-key";
const WEEKS = 44;   // Arbeitswochen pro Jahr: 52 − ca. 30 Urlaubstage − Feiertage NRW
const YEARS = 3;    // einmalige Kosten werden auf 3 Jahre verteilt (üblicher Planungshorizont für IT-Maßnahmen)
const MODELS = { anthropic: "claude-sonnet-5-5", openai: "gpt-5.4-mini" };
const providerOf = (key) => (key.startsWith("sk-ant-") ? "anthropic" : "openai");

/* Beispiel: Service-Team eines Mobilfunkanbieters.
   [Titel, Beschreibung, Personen, €/h, Stunden pro Woche und Person heute] */
const EXAMPLE_IDEAS = [
  // Stundensatz = Arbeitgeberkosten: Service-Mitarbeitende ~3.100–3.300 € brutto/Monat + ~21 % Nebenkosten ≈ 25 €/h
  ["Meeting-Zeiten reduzieren", "Weniger und kürzere Meetings, klare Agenda", 15, 30, 3],
  ["Wissensdatenbank verbessern", "Zentrale, durchsuchbare Ablage für Prozesse und Lösungen", 15, 28, 2],
  ["Onboarding automatisieren", "Checklisten, Zugänge und Material automatisch bereitstellen", 3, 28, 5],
  ["AI-Assistent für Support-Anfragen", "KI schlägt Antworten auf häufige Kundenanfragen vor", 10, 25, 20],
  ["Automatische Dokumentation", "Ticket-Notizen und Gesprächszusammenfassungen automatisch erstellen", 10, 25, 3],
  ["Tool-Landschaft vereinfachen", "Überschneidende Tools zusammenführen", 15, 30, 1.5]
];

/* Interner Fallback, falls die KI nicht erreichbar ist (z. B. kein Internet bei der Demo). */
const FALLBACK_RULES = [
  { kw: ["meeting"], save: 30, effort: 16, run: 0, why: "Kürzere und seltenere Meetings sparen direkt Zeit bei allen Teilnehmenden. Die Umsetzung braucht vor allem Absprachen." },
  { kw: ["wissen", "wiki"], save: 40, effort: 120, run: 1500, why: "Weniger Suchzeit und Rückfragen, wenn Lösungen zentral auffindbar sind – sofern die Inhalte gepflegt werden." },
  { kw: ["onboarding", "einarbeitung"], save: 35, effort: 80, run: 0, why: "Zugänge und Standardfragen kosten neue Mitarbeitende und Paten weniger Zeit." },
  { kw: ["support", "assistent", "anfrage"], save: 20, effort: 200, run: 6000, why: "Antwortvorschläge verkürzen die Bearbeitung wiederkehrender Anfragen, kosten aber Integration und API-Gebühren." },
  { kw: ["dokument", "protokoll", "notiz"], save: 50, effort: 60, run: 2400, why: "Notizen und Zusammenfassungen entstehen automatisch statt manuell." },
  { kw: ["tool", "lizenz"], save: 25, effort: 160, run: -3000, why: "Weniger Kontextwechsel und Lizenzkosten, aber aufwendige Migration." },
  { kw: ["report", "bericht", "kpi"], save: 75, effort: 40, run: 0, why: "Manuelle Reports lassen sich gut automatisieren." },
  { kw: ["faq", "self-service"], save: 10, effort: 60, run: 0, why: "Jede Anfrage, die gar nicht erst entsteht, spart Bearbeitungszeit." },
  { kw: ["textbaustein", "vorlage"], save: 15, effort: 16, run: 0, why: "Geringer Aufwand, sofort wirksam: Standardantworten müssen nicht neu formuliert werden." },
  { kw: ["projekt", "dashboard", "übersicht"], save: 40, effort: 40, run: 600, why: "Weniger Statusabfragen, weil der Stand jederzeit sichtbar ist." }
];
const FALLBACK_DEFAULT = { save: 20, effort: 40, run: 0, why: "Vorsichtige Standardschätzung – bitte Werte prüfen." };

/* ---------- State ---------- */
let state = loadState();
let openId = null;

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && Array.isArray(s.ideas)) return s;
  } catch (e) { /* kein Speicher verfügbar */ }
  return { ideas: [] };
}
function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
function getKey() { try { return localStorage.getItem(KEY_STORE) || ""; } catch (e) { return ""; } }
function setKey(k) { try { k ? localStorage.setItem(KEY_STORE, k) : localStorage.removeItem(KEY_STORE); } catch (e) {} }

const $ = (id) => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eur = (n) => (n < 0 ? "−" : "") + Math.abs(Math.round(n)).toLocaleString("de-DE") + " €";
const num = (v, d = 0) => { const n = parseFloat(String(v).replace(",", ".")); return Number.isFinite(n) ? n : d; };
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const de = (n) => String(n).replace(".", ",");

/* ---------- Berechnung ----------
   Zeitersparnis/Jahr = Personen × Std./Woche heute × Ersparnis % × €/h × 44 Wochen
   Nutzen/Jahr        = Zeitersparnis − Umsetzungsaufwand (h × €/h) ÷ 3 Jahre − laufende Kosten */
function calc(idea) {
  const e = idea.eval;
  const gross = idea.persons * idea.hours * (e.save / 100) * idea.rate * WEEKS;
  const oneTime = e.effort * idea.rate;
  return { gross, oneTime, net: gross - oneTime / YEARS - e.running };
}

function sanitize(raw) {
  return {
    save: clamp(Math.round(num(raw.save, 0)), 0, 100),
    effort: clamp(num(raw.effort, 0), 0, 100000),
    running: clamp(num(raw.running, 0), -1e7, 1e7),
    why: String(raw.why || "").trim(),
    oneItems: (Array.isArray(raw.oneItems) ? raw.oneItems : []).map((x) => ({ name: String(x.name || "").trim(), hours: clamp(num(x.hours, 0), 0, 10000) })).filter((x) => x.name),
    runItems: (Array.isArray(raw.runItems) ? raw.runItems : []).map((x) => ({ name: String(x.name || "").trim(), eur: clamp(num(x.eur, 0), -1e6, 1e6), calc: String(x.calc || "").trim() })).filter((x) => x.name),
    risk: String(raw.risk || "").trim()
  };
}

function fallbackEvaluate(idea) {
  const text = (idea.title + " " + (idea.desc || "")).toLowerCase();
  const r = FALLBACK_RULES.find((x) => x.kw.some((k) => text.includes(k))) || FALLBACK_DEFAULT;
  return sanitize({ save: r.save, effort: r.effort, running: r.run, why: r.why });
}

/* ---------- KI ---------- */
const TOOL = {
  name: "bewertungen_speichern",
  description: "Speichert die Schätzung für jede Idee.",
  input_schema: {
    type: "object",
    properties: {
      bewertungen: {
        type: "array",
        items: {
          type: "object",
          properties: {
            id: { type: "string" },
            ersparnis_prozent: { type: "integer", description: "Realistisch erwarteter Anteil der heutigen Zeit, der wegfällt (0–100), Unsicherheit bereits eingepreist" },
            umsetzung: {
              type: "array", description: "Einmalige Arbeitsschritte der Einführung",
              items: { type: "object", properties: { posten: { type: "string" }, stunden: { type: "number" } }, required: ["posten", "stunden"] }
            },
            laufende_kosten: {
              type: "array", description: "Jährliche Kosten; negative Beträge = Einsparung",
              items: { type: "object", properties: { posten: { type: "string" }, eur_pro_jahr: { type: "number" }, rechnung: { type: "string", description: "Rechenweg mit Einheiten, z. B. 10 Nutzer × 40 €/Monat" } }, required: ["posten", "eur_pro_jahr", "rechnung"] }
            },
            begruendung: { type: "string", description: "2–3 kurze Sätze" },
            risiken: { type: "string", description: "1 kurzer Satz" }
          },
          required: ["id", "ersparnis_prozent", "umsetzung", "laufende_kosten", "begruendung", "risiken"]
        }
      }
    },
    required: ["bewertungen"]
  }
};

function buildPrompt(ideas) {
  return `Du bist ein erfahrener Prozess- und Wirtschaftlichkeitsanalyst in einem Unternehmen. Ein Team hat Verbesserungsideen gesammelt. Zu jeder Idee ist angegeben, wie viele Personen betroffen sind und wie viele Stunden pro Woche eine Person HEUTE mit der betroffenen Aufgabe verbringt.

Schätze für jede Idee:
- ersparnis_prozent: welcher Anteil dieser heutigen Zeit durch die Idee realistisch wegfällt – der erwartete Wert, weder optimistisch noch pessimistisch. Orientierung aus der Praxis: organisatorische Regeln (z. B. Meetings) 30–50 %, bessere Ablage/Suche 30–50 %, KI-Entwürfe mit menschlicher Prüfung 40–60 %, vollständige Automatisierung 70–90 %. Weiche nur mit konkretem Grund davon ab.
- umsetzung: Liste der einmaligen Arbeitsschritte mit Stunden (2–4 Posten). Organisatorisches ist günstig, Software-Integration teuer.
- laufende_kosten: Liste der jährlichen Kosten in Euro (0–3 Posten; leer, wenn keine). Rechne von unten nach oben (Nutzer × Preis pro Monat × 12; Pflegestunden × Stundensatz der Idee). Orientierung: KI-Assistenz-Add-ons für Helpdesks ca. 25–50 € pro Nutzer und Monat, typische SaaS-Tools 5–30 € pro Nutzer und Monat, Pflege meist wenige Stunden pro Monat. Wegfallende Kosten als negativer Betrag.
- posten: kurzer Name (2–5 Wörter) ohne Zahlen, z. B. "KI-Add-on" oder "Pflege und Qualitätskontrolle".
- rechnung (nur bei laufenden Kosten): Rechenweg pro Monat mit Einheiten, z. B. "10 Nutzer × 40 €/Monat" oder "4 h/Monat × 25 €/h". Keine Überlegungen, Korrekturen oder Auslassungspunkte.
- begruendung (2–3 kurze Sätze) und risiken (1 Satz), auf Deutsch und konkret.

Schätze realistisch, interpretiere jede Idee so, wie sie in einem typischen Büro- oder Service-Team am sinnvollsten ist, und bewerte alle Ideen im Vergleich zueinander.

Ideen:
${ideas.map((i) => `- id: ${i.id} | ${i.title}${i.desc ? " – " + i.desc : ""} | ${i.persons} Personen, heute ${de(i.hours)} Std./Woche pro Person, Stundensatz ${i.rate} €`).join("\n")}

Rufe unbedingt das Tool "${TOOL.name}" mit genau einer Bewertung pro Idee auf. Antworte nicht mit Fließtext.`;
}

async function postJson(url, headers, body) {
  const res = await fetch(url, { method: "POST", headers: { "content-type": "application/json", ...headers }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  return { res, data, msg: data?.error?.message || res.statusText };
}

async function callClaude(ideas, key, opts = { temperature: true, forceTool: true }) {
  const body = {
    model: MODELS.anthropic, max_tokens: 16000, tools: [TOOL],
    tool_choice: opts.forceTool ? { type: "tool", name: TOOL.name } : { type: "auto" },
    messages: [{ role: "user", content: buildPrompt(ideas) }]
  };
  if (opts.temperature) body.temperature = 0;
  const { res, data, msg } = await postJson("https://api.anthropic.com/v1/messages",
    { "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" }, body);
  if (!res.ok) {
    // Nicht jedes Modell unterstützt jeden Parameter -> ohne diesen Parameter erneut versuchen
    if (res.status === 400 && opts.forceTool && /tool_choice/i.test(msg)) return callClaude(ideas, key, { ...opts, forceTool: false });
    if (res.status === 400 && opts.temperature && /temperature/i.test(msg)) return callClaude(ideas, key, { ...opts, temperature: false });
    throw Object.assign(new Error(msg), { status: res.status });
  }
  const tool = (data.content || []).find((c) => c.type === "tool_use" && c.name === TOOL.name);
  if (tool) return tool.input?.bewertungen;
  return extractJson((data.content || []).filter((c) => c.type === "text").map((c) => c.text).join("\n"))?.bewertungen;
}

async function callOpenAI(ideas, key, withTemperature = true) {
  const body = {
    model: MODELS.openai,
    messages: [{ role: "user", content: buildPrompt(ideas) }],
    tools: [{ type: "function", function: { name: TOOL.name, description: TOOL.description, parameters: TOOL.input_schema } }],
    tool_choice: { type: "function", function: { name: TOOL.name } }
  };
  if (withTemperature) body.temperature = 0;
  const { res, data, msg } = await postJson("https://api.openai.com/v1/chat/completions", { authorization: "Bearer " + key }, body);
  if (!res.ok) {
    if (withTemperature && res.status === 400 && /temperature/i.test(msg)) return callOpenAI(ideas, key, false);
    throw Object.assign(new Error(msg), { status: res.status });
  }
  return extractJson(data.choices?.[0]?.message?.tool_calls?.[0]?.function?.arguments || "")?.bewertungen;
}

function extractJson(text) {
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  if (a < 0 || b <= a) return null;
  try { return JSON.parse(text.slice(a, b + 1)); } catch (e) { return null; }
}

function fromAI(b) {
  const oneItems = (b.umsetzung || []).map((x) => ({ name: x.posten, hours: x.stunden }));
  const runItems = (b.laufende_kosten || []).map((x) => ({ name: x.posten, eur: x.eur_pro_jahr, calc: x.rechnung }));
  return sanitize({
    save: b.ersparnis_prozent,
    effort: oneItems.reduce((s, x) => s + num(x.hours, 0), 0),     // Summen rechnet das Programm, nicht die KI
    running: runItems.reduce((s, x) => s + num(x.eur, 0), 0),
    oneItems, runItems, why: b.begruendung, risk: b.risiken
  });
}

/* Fingerabdruck einer Idee: ändert sich etwas daran, wird sie neu bewertet.
   Unveränderte Ideen behalten ihre Bewertung -> stabile Ergebnisse trotz schwankender KI-Antworten. */
const signature = (i) => JSON.stringify([i.title, i.desc, i.persons, i.rate, i.hours]);

async function evaluate() {
  if (!state.ideas.length) return setStatus("Bitte zuerst Ideen erfassen.", true);
  const key = getKey();
  if (!key) { $("apiKey").focus(); return setStatus("Bitte API-Key eintragen.", true); }

  const todo = state.ideas.filter((i) => !i.eval || i.evalSig !== signature(i));
  if (!todo.length) return setStatus("Alle Ideen sind bereits bewertet.");

  const btn = $("evaluate");
  btn.disabled = true;
  setStatus(`<span class="spinner"></span>Die KI bewertet ${todo.length} ${todo.length === 1 ? "Idee" : "Ideen"} …`);
  try {
    const results = providerOf(key) === "anthropic" ? await callClaude(todo, key) : await callOpenAI(todo, key);
    if (!Array.isArray(results)) throw new Error("Keine gültige Antwort der KI.");
    todo.forEach((idea) => {
      const b = results.find((r) => String(r.id) === idea.id);
      idea.eval = b ? fromAI(b) : fallbackEvaluate(idea);
      idea.evalSig = b ? signature(idea) : null;   // ohne KI-Antwort beim nächsten Klick erneut versuchen
    });
    setStatus("");
  } catch (err) {
    const reason = err.status === 401 ? "API-Key ungültig"
      : /quota|credit|balance/i.test(err.message || "") ? "kein Guthaben"
      : "nicht erreichbar";
    todo.forEach((idea) => { idea.eval = fallbackEvaluate(idea); idea.evalSig = null; });
    setStatus(`KI ${reason} – vorläufige Schätzung ohne KI angezeigt.`, true);
  } finally {
    btn.disabled = false;
    openId = null; saveState(); renderResults();
  }
}
function setStatus(html, isError) { const s = $("status"); s.innerHTML = html; s.classList.toggle("error", !!isError); }

/* ---------- Rendering ---------- */
function renderIdeas() {
  const ul = $("ideaList");
  ul.innerHTML = state.ideas.map((i) => `<li class="idea-grid">
      <div class="title" title="${esc(i.desc || i.title)}">${esc(i.title)}${i.desc ? `<small>${esc(i.desc)}</small>` : ""}</div>
      <div><label class="mobile-label">Personen</label><input type="number" min="1" value="${i.persons}" data-field="persons" data-id="${i.id}"></div>
      <div><label class="mobile-label">€ pro Stunde</label><input type="number" min="1" value="${i.rate}" data-field="rate" data-id="${i.id}"></div>
      <div><label class="mobile-label">Std. pro Woche</label><input type="number" min="0" step="0.5" value="${i.hours}" data-field="hours" data-id="${i.id}"></div>
      <div><button type="button" class="ghost del" aria-label="Idee löschen" data-del="${i.id}">×</button></div>
    </li>`).join("");
  $("ideaHead").hidden = $("noIdeas").hidden = false;
  $("ideaHead").hidden = !state.ideas.length;
  $("noIdeas").hidden = !!state.ideas.length;
}

function renderResults() {
  const list = state.ideas.filter((i) => i.eval).map((i) => ({ idea: i, r: calc(i) })).sort((a, b) => b.r.net - a.r.net);
  $("results").hidden = !list.length;
  if (!list.length) return;
  const max = Math.max(...list.map((x) => x.r.net), 1);
  $("resultBody").innerHTML = list.map(({ idea, r }, idx) => {
    const w = r.net > 0 ? Math.max(2, (r.net / max) * 100) : 0;
    return `<div class="result-row${idx < 3 ? " top" : ""}" data-open="${idea.id}">
        <div class="rank">${idx + 1}</div>
        <div class="rtitle">${esc(idea.title)}</div>
        <div class="value"><strong class="${r.net < 0 ? "neg" : ""}">${eur(r.net)} / Jahr</strong><div class="bar"><i style="width:${w}%"></i></div></div>
      </div>` + (openId === idea.id ? detail(idea, r) : "");
  }).join("");
}

function costTable(idea) {
  const e = idea.eval;
  if (!e.oneItems?.length && !e.runItems?.length) return "";
  const item = (name, val, sub) => `<div class="ci"><span>${esc(name)}${sub ? `<small>${esc(sub)}</small>` : ""}</span><span>${val}</span></div>`;
  let html = '<h4>Kosten</h4><div class="costs">';
  if (e.oneItems?.length) {
    html += '<div class="cg">Einmalig</div>';
    html += e.oneItems.map((x) => item(x.name, de(x.hours) + " h")).join("");
    html += `<div class="ci sum"><span>${de(e.effort)} h × ${idea.rate} €/h</span><span>${eur(e.effort * idea.rate)}</span></div>`;
  }
  if (e.runItems?.length) {
    html += '<div class="cg">Pro Jahr</div>';
    html += e.runItems.map((x) => item(x.name, eur(x.eur), x.calc)).join("");
    if (e.runItems.length > 1) html += `<div class="ci sum"><span>Summe</span><span>${eur(e.running)}</span></div>`;
  }
  return html + "</div>";
}

function detail(idea, r) {
  const e = idea.eval;
  const f = (k, label, step) => `<div><label>${label}</label><input type="number" step="${step}" value="${e[k]}" data-edit="${k}" data-id="${idea.id}"></div>`;
  return `<div class="detail">
    <div>
      <h4>Begründung</h4><p>${esc(e.why) || "–"}</p>
      ${costTable(idea)}
      ${e.risk ? `<h4>Risiko</h4><p>${esc(e.risk)}</p>` : ""}
    </div>
    <div>
      <div class="edit">
        ${f("save", "Ersparnis %", 5)}
        ${f("effort", "Umsetzung (h)", 1)}
        ${f("running", "Laufend €/Jahr", 100)}
      </div>
      <div class="calc">${idea.persons} Pers. × ${de(idea.hours)} h × ${e.save} % × ${idea.rate} € × ${WEEKS} Wo. = ${eur(r.gross)}<br>
        − ${eur(r.oneTime)} Umsetzung ÷ ${YEARS} Jahre ${e.running < 0 ? `+ ${eur(-e.running)} eingespart` : `− ${eur(e.running)} laufend`} = <strong>${eur(r.net)}</strong></div>
    </div>
  </div>`;
}

function renderKey() {
  const has = !!getKey();
  $("keyRow").hidden = has;
  $("keySaved").hidden = !has;
}

/* ---------- Events ---------- */
$("ideaForm").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const title = $("nTitle").value.trim();
  if (!title) return;
  state.ideas.push({
    id: uid(), title, desc: $("nDesc").value.trim(),
    persons: Math.max(1, Math.round(num($("nPersons").value, 1))),
    rate: Math.max(1, num($("nRate").value, 50)),
    hours: Math.max(0, num($("nHours").value, 0))
  });
  $("nTitle").value = ""; $("nDesc").value = ""; $("nTitle").focus();
  saveState(); renderIdeas();
});
$("ideaList").addEventListener("click", (ev) => {
  const id = ev.target.dataset.del; if (!id) return;
  state.ideas = state.ideas.filter((i) => i.id !== id);
  saveState(); renderIdeas(); renderResults();
});
// "input" statt "change": Ergebnis aktualisiert sich beim Tippen, ein Klick danach geht nicht verloren
$("ideaList").addEventListener("input", (ev) => {
  const field = ev.target.dataset.field; if (!field) return;
  const idea = state.ideas.find((i) => i.id === ev.target.dataset.id);
  if (ev.target.value.trim() === "") return;
  const v = num(ev.target.value, idea[field]);
  idea[field] = field === "persons" ? Math.max(1, Math.round(v)) : Math.max(field === "hours" ? 0 : 1, v);
  saveState(); renderResults();
});
$("loadExamples").addEventListener("click", () => {
  const existing = new Set(state.ideas.map((i) => i.title.toLowerCase()));
  EXAMPLE_IDEAS.forEach(([title, desc, persons, rate, hours]) => {
    if (!existing.has(title.toLowerCase())) state.ideas.push({ id: uid(), title, desc, persons, rate, hours });
  });
  saveState(); renderIdeas();
});
$("clearIdeas").addEventListener("click", () => { state.ideas = []; saveState(); renderIdeas(); renderResults(); setStatus(""); });

const saveKey = () => { const k = $("apiKey").value.trim(); if (!k) return; setKey(k); $("apiKey").value = ""; renderKey(); setStatus(""); };
$("saveKey").addEventListener("click", saveKey);
$("apiKey").addEventListener("keydown", (ev) => { if (ev.key === "Enter") saveKey(); });
$("deleteKey").addEventListener("click", () => { setKey(""); renderKey(); });
$("evaluate").addEventListener("click", evaluate);

$("resultBody").addEventListener("click", (ev) => {
  if (ev.target.closest(".detail")) return;
  const row = ev.target.closest(".result-row");
  if (row) { openId = openId === row.dataset.open ? null : row.dataset.open; renderResults(); }
});
$("resultBody").addEventListener("change", (ev) => {
  const k = ev.target.dataset.edit; if (!k) return;
  const idea = state.ideas.find((i) => i.id === ev.target.dataset.id);
  idea.eval[k] = num(ev.target.value, 0);
  if (k === "effort") idea.eval.oneItems = [];    // manuell überschrieben -> KI-Aufschlüsselung passt nicht mehr
  if (k === "running") idea.eval.runItems = [];
  idea.eval = sanitize(idea.eval);
  saveState(); renderResults();
});

renderIdeas(); renderResults(); renderKey();
</script>
</body>
</html>
